services:

  job-assistant:

    build: .

    container_name: job-assistant

    restart: unless-stopped

    ports:

      - "8095:8080"

    env_file:

      - .env

    volumes:

      - ./data:/app/data

    networks:

      - default

      - cloudflared_net


networks:

  cloudflared_net:

    external: true
